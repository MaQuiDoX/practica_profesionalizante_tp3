<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TA TE TI</title>
    <script defer src="index.js"></script>
    <link rel="stylesheet" href="tateti.css">
</head>
<body>
    <h1>TA TE TI</h1>
    <label for="dificultad">Dificultad</label>
    <select id="dificultad">
        <option value="facil">Fácil — al azar</option>
        <option value="medio">Medio — gana o bloquea</option>
        <option value="dificil">Difícil — estrategia óptima</option>
    </select>
    <p>Cambiar la dificultad inicia una nueva partida.</p>
<div id="tablero">
    <button class="celda" data-indice="0"></button>
    <button class="celda" data-indice="1"></button>
    <button class="celda" data-indice="2"></button>
    <button class="celda" data-indice="3"></button>
    <button class="celda" data-indice="4"></button>
    <button class="celda" data-indice="5"></button>
    <button class="celda" data-indice="6"></button>
    <button class="celda" data-indice="7"></button>
    <button class="celda" data-indice="8"></button>
  </div>
    
    <button id="reiniciar">Reiniciar juego</button>
    <p id="mensaje" role="status">Tu turno (❎)</p>
</body>
</html>
